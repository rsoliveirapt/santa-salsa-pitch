<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Bun Gradient -->
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    
    <!-- Bun Top Highlight -->
    <linearGradient id="bunHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <!-- Sausage Gradient -->
    <linearGradient id="sausageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Mustard Sauce Gradient -->
    <linearGradient id="mustardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEB01" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Pink Sauce Gradient -->
    <linearGradient id="pinkSauceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Dark Circular Background for High Contrast Tab Icon -->
  <circle cx="32" cy="32" r="30" fill="#0D0D0D" stroke="#FFEB01" stroke-width="3" />

  <!-- Bottom Bun Shadow -->
  <ellipse cx="32" cy="46" rx="22" ry="7" fill="#78350F" opacity="0.9" />

  <!-- Main Brioche Bun -->
  <path d="M 10 33 C 10 23, 20 23, 32 23 C 44 23, 54 23, 54 33 C 54 44, 44 46, 32 46 C 20 46, 10 44, 10 33 Z" fill="url(#bunGrad)" stroke="#171717" stroke-width="2" />
  <path d="M 12 30 C 14 24, 22 24, 32 24 C 42 24, 50 24, 52 30" fill="none" stroke="url(#bunHighlight)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sausage -->
  <path d="M 8 32 C 8 27, 14 27, 32 27 C 50 27, 56 27, 56 32 C 56 37, 50 37, 32 37 C 14 37, 8 37, 8 32 Z" fill="url(#sausageGrad)" stroke="#450A0A" stroke-width="1.8" />
  <!-- Sausage Gloss Line -->
  <path d="M 13 30 Q 32 28 51 30" fill="none" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Shredded Cabbage & Potato Matchsticks Layer -->
  <path d="M 14 28 Q 18 25 22 28 Q 26 24 30 28 Q 34 24 38 28 Q 42 25 46 28 Q 50 24 53 28" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 16 27 Q 20 23 24 27 Q 28 23 32 27 Q 36 23 40 27 Q 44 23 48 27" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />

  <!-- Zig-zag Pink & Garlic Sauces Drizzle -->
  <path d="M 12 31 Q 16 24, 22 30 T 32 24 T 42 30 T 52 24" fill="none" stroke="url(#pinkSauceGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 14 32 Q 18 26, 24 31 T 34 26 T 44 31 T 50 26" fill="none" stroke="url(#mustardGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sesame Seeds -->
  <ellipse cx="20" cy="40" rx="1.2" ry="0.6" fill="#FEF3C7" transform="rotate(-15 20 40)" />
  <ellipse cx="28" cy="42" rx="1.2" ry="0.6" fill="#FEF3C7" transform="rotate(10 28 42)" />
  <ellipse cx="36" cy="41" rx="1.2" ry="0.6" fill="#FEF3C7" transform="rotate(-5 36 41)" />
  <ellipse cx="44" cy="39" rx="1.2" ry="0.6" fill="#FEF3C7" transform="rotate(20 44 39)" />
</svg>